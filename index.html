<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jean-Luc Prat · Mental Conseil</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Mental Conseil">
<meta name="theme-color" content="#262149">
<meta name="description" content="Carte de visite de Jean-Luc PRAT, préparateur mental spécialisé en entreprise et dans le sport.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: une seule carte posée sur un fond lilas, logo en tête, contacts en liste, QR en pied */
:root {
  --ground: #EEEEF5;
  --card: #FFFFFF;
  --ink: #262149;
  --slate: #414167;
  --lavender: #6A6B9B;
  --muted: #6E6D8A;
  --line: #E2E1EC;
  --soft: #F5F5FA;
  --bar1: #6A6B9B; --bar2: #414167; --bar3: #262149;
  --btn-bg: #262149; --btn-fg: #FFFFFF;
  --orange: #E2701F; --orange-soft: #FDF0E6; --orange-line: #F6CFAF;
  --display: "Lexend", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #121127; --card: #1C1A38; --ink: #ECEBF8; --slate: #C3C2E0; --lavender: #9D9ED0;
    --muted: #A3A2C2; --line: #2E2C52; --soft: #23214255;
    --bar1: #7C7DB4; --bar2: #A9A9D6; --bar3: #E4E3F5;
    --btn-bg: #E4E3F5; --btn-fg: #1C1A38; --orange: #F39A55; --orange-soft: #F39A551F; --orange-line: #F39A5566; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #121127; --card: #1C1A38; --ink: #ECEBF8; --slate: #C3C2E0; --lavender: #9D9ED0;
  --muted: #A3A2C2; --line: #2E2C52; --soft: #23214255;
  --bar1: #7C7DB4; --bar2: #A9A9D6; --bar3: #E4E3F5;
  --btn-bg: #E4E3F5; --btn-fg: #1C1A38; --orange: #F39A55; --orange-soft: #F39A551F; --orange-line: #F39A5566; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center;
}
.card {
  width: 100%; max-width: 420px; background: var(--card);
  border-radius: 22px; box-shadow: 0 1px 2px #2621490f, 0 18px 50px -20px #26214940;
  overflow: hidden;
}
.head { padding: 40px 28px 28px; display: grid; justify-items: center; gap: 22px; text-align: center; }
.mark { width: 92px; height: auto; display: block; }
.word { display: grid; gap: 4px; justify-items: center; }
.word b { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .34em; margin-right: -.34em; line-height: 1; }
.word span { font-family: var(--display); font-weight: 300; font-size: 15px; letter-spacing: .28em; margin-right: -.28em; color: var(--orange); font-weight: 400; }

.who { padding: 24px 28px 4px; border-top: 1px solid var(--line); }
.who h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 26px; letter-spacing: -.01em; text-wrap: balance; }
.who h1::after { content: ""; display: block; width: 36px; height: 3px; border-radius: 3px; background: var(--orange); margin: 10px 0 8px; }
.who p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.fields { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.fields span {
  font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--orange); background: var(--orange-soft); border: 1px solid var(--orange-line); border-radius: 999px; padding: 5px 12px;
}

.contacts { list-style: none; margin: 18px 0 0; padding: 0 12px; display: grid; }
.contacts li { display: flex; align-items: center; gap: 4px; border-radius: 14px; }
.contacts a.row {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 12px 10px;
  color: inherit; text-decoration: none; border-radius: 14px;
}
.contacts a.row:hover { background: var(--soft); }
.contacts a.row:hover .ico { color: var(--orange); border-color: var(--orange-line); }
.ico { transition: color .15s, border-color .15s; }
.contacts a.row:focus-visible, button:focus-visible, .cta:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.ico { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); color: var(--slate); border: 1px solid var(--line); }
.ico svg { width: 19px; height: 19px; }
.txt { min-width: 0; display: grid; }
.txt small { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.txt strong { font-weight: 500; font-size: 16px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; user-select: all; }
.copy {
  flex: none; border: 0; background: none; color: var(--muted); font: 600 12px var(--body);
  padding: 8px 10px; border-radius: 10px; cursor: pointer;
}
.copy:hover { color: var(--orange); background: var(--orange-soft); }

.foot { padding: 20px 28px 30px; display: grid; gap: 22px; }
.cta {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
  border: 0; border-radius: 14px; padding: 15px 18px; cursor: pointer;
  background: var(--btn-bg); color: var(--btn-fg); font: 600 16px var(--body);
}
.cta:hover { filter: brightness(1.12); }
.cta svg { width: 18px; height: 18px; color: var(--orange); }
.qr { display: flex; align-items: center; gap: 18px; padding-top: 22px; border-top: 1px solid var(--line); }
.qr-box { flex: none; width: 104px; height: 104px; padding: 8px; background: #FFFFFF; border-radius: 12px; border: 1px solid var(--line); }
.qr-box img, .qr-box canvas { width: 100% !important; height: 100% !important; display: block; }
.qr p { margin: 0; font-size: 14px; color: var(--muted); }
.qr p strong { display: block; color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 15px; margin-bottom: 2px; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--btn-bg); color: var(--btn-fg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .5s ease-out both; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
}
</style>
</head>
<body>

<main class="card">
  <header class="head">
    <svg class="mark" viewBox="88 18 214 234" role="img" aria-label="Logo Mental Conseil">
      <path fill="var(--bar1)" d="M98,96 a24,24 0 0 1 48,0 L146,188 C146,204 156,213 172,219 C138,224 98,214 98,184 Z"/>
      <path fill="var(--bar2)" d="M152,82 C152,63 166,52 185,52 C203,52 215,65 215,83 L215,212 C215,227 229,237 251,244 C202,250 152,236 152,200 Z"/>
      <path fill="var(--bar3)" d="M218,48 C220,32 239,24 258,24 C278,24 292,39 292,58 L292,159 C292,175 281,186 267,186 C253,186 242,175 242,159 L242,74 C242,59 233,50 218,48 Z"/>
    </svg>
    <div class="word"><b>MENTAL</b><span>Conseil</span></div>
  </header>

  <section class="who">
    <h1>Jean-Luc PRAT</h1>
    <p>Préparateur Mental Spécialisé</p>
    <div class="fields"><span>Entreprise</span><span>Sport</span></div>
  </section>

  <ul class="contacts">
    <li>
      <a class="row" href="tel:+33633210331">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span>
        <span class="txt"><small>Téléphone</small><strong>06 33 21 03 31</strong></span>
      </a>
      <button class="copy" type="button" id="copy-tel" data-copy="06 33 21 03 31">Copier</button>
    </li>
    <li>
      <a class="row" href="mailto:contact@mental-conseil.fr">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
        <span class="txt"><small>E-mail</small><strong>contact@mental-conseil.fr</strong></span>
      </a>
      <button class="copy" type="button" id="copy-mail" data-copy="contact@mental-conseil.fr">Copier</button>
    </li>
    <li>
      <a class="row" href="https://www.mental-conseil.fr" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3"/></svg></span>
        <span class="txt"><small>Site web</small><strong>www.mental-conseil.fr</strong></span>
      </a>
      <button class="copy" type="button" id="copy-web" data-copy="https://www.mental-conseil.fr">Copier</button>
    </li>
  </ul>

  <footer class="foot">
    <button class="cta" type="button" id="save-contact">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><path d="M3 20c0-3.5 3-6 7-6s7 2.5 7 6M19 8v6M16 11h6"/></svg>
      Ajouter à mes contacts
    </button>
    <div class="qr">
      <div class="qr-box" id="qr" aria-label="QR code vers cette carte"></div>
      <p><strong>Partager cette carte</strong>Scannez le code pour ouvrir cette carte sur votre téléphone.</p>
    </div>
  </footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var toast = document.getElementById('toast'), t;
  function say(msg) { toast.textContent = msg; toast.classList.add('on'); clearTimeout(t); t = setTimeout(function(){ toast.classList.remove('on'); }, 1800); }

  document.querySelectorAll('.copy').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = b.getAttribute('data-copy');
      var p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(v) : Promise.reject();
      p.then(function(){ say('Copié'); }).catch(function(){
        var s = b.parentNode.querySelector('strong'), r = document.createRange();
        r.selectNodeContents(s); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        say('Texte sélectionné, copiez-le');
      });
    });
  });

  var vcard = [
    'BEGIN:VCARD','VERSION:3.0',
    'N:PRAT;Jean-Luc;;;','FN:Jean-Luc PRAT',
    'ORG:Mental Conseil','TITLE:Préparateur Mental Spécialisé – Entreprise & Sport',
    'TEL;TYPE=CELL:+33633210331','EMAIL;TYPE=WORK:contact@mental-conseil.fr',
    'URL:https://www.mental-conseil.fr','END:VCARD'
  ].join('\r\n');
  document.getElementById('save-contact').addEventListener('click', function () {
    try {
      var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'Jean-Luc-Prat-Mental-Conseil.vcf';
      document.body.appendChild(a); a.click(); a.remove();
      say('Fiche contact téléchargée');
    } catch (e) { say('Téléchargement impossible ici'); }
  });

  try {
    new QRCode(document.getElementById('qr'), {
      text: 'https://cassocies-debug.github.io/Carte-virtuelle-Mental-Conseil/', width: 176, height: 176,
      colorDark: '#262149', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M
    });
  } catch (e) { document.querySelector('.qr').hidden = true; }
})();
</script>
</body>
</html>
